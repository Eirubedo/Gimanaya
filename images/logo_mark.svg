<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
    <!-- Central Circle -->
    <circle cx="100" cy="100" r="12" fill="#dd5d1b" />
    
    <!-- Group of 6 rotated question marks -->
    <g fill="none" stroke="#dd5d1b" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
        <!-- Question Mark 1 (0 deg) -->
        <path d="M 100 78 L 100 68 C 100 50, 78 52, 78 40 C 78 28, 98 25, 112 33 C 124 40, 122 56, 108 58" />
        
        <!-- Question Mark 2 (60 deg) -->
        <path d="M 100 78 L 100 68 C 100 50, 78 52, 78 40 C 78 28, 98 25, 112 33 C 124 40, 122 56, 108 58" transform="rotate(60, 100, 100)" />
        
        <!-- Question Mark 3 (120 deg) -->
        <path d="M 100 78 L 100 68 C 100 50, 78 52, 78 40 C 78 28, 98 25, 112 33 C 124 40, 122 56, 108 58" transform="rotate(120, 100, 100)" />
        
        <!-- Question Mark 4 (180 deg) -->
        <path d="M 100 78 L 100 68 C 100 50, 78 52, 78 40 C 78 28, 98 25, 112 33 C 124 40, 122 56, 108 58" transform="rotate(180, 100, 100)" />
        
        <!-- Question Mark 5 (240 deg) -->
        <path d="M 100 78 L 100 68 C 100 50, 78 52, 78 40 C 78 28, 98 25, 112 33 C 124 40, 122 56, 108 58" transform="rotate(240, 100, 100)" />
        
        <!-- Question Mark 6 (300 deg) -->
        <path d="M 100 78 L 100 68 C 100 50, 78 52, 78 40 C 78 28, 98 25, 112 33 C 124 40, 122 56, 108 58" transform="rotate(300, 100, 100)" />
    </g>
</svg>