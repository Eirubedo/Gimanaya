<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%">
    <!-- Definitions for styling and fonts -->
    <style>
        .brand-text {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-weight: 800;
            font-size: 60px;
            letter-spacing: -0.03em;
        }
        .question-mark-main {
            font-family: 'Georgia', 'Times New Roman', Times, serif;
            font-weight: bold;
            font-size: 72px;
        }
        .question-mark-sub {
            font-family: 'Georgia', 'Times New Roman', Times, serif;
            font-weight: bold;
            font-size: 54px;
        }
    </style>

    <!-- Logo Flower Group (Centered horizontally at X=70, Y=60) -->
    <g id="logo-flower">
        <!-- Grey Question Marks (Rotated around 70, 60) -->
        <g class="question-mark-sub" fill="#4d4d4d" text-anchor="middle">
            <!-- 60 deg -->
            <text x="70" y="32" transform="rotate(60, 70, 60)">?</text>
            <!-- 120 deg -->
            <text x="70" y="32" transform="rotate(120, 70, 60)">?</text>
            <!-- 180 deg (bottom) -->
            <text x="70" y="32" transform="rotate(180, 70, 60)">?</text>
            <!-- 240 deg -->
            <text x="70" y="32" transform="rotate(240, 70, 60)">?</text>
            <!-- 300 deg -->
            <text x="70" y="32" transform="rotate(300, 70, 60)">?</text>
        </g>
        
        <!-- Central Orange Circle -->
        <circle cx="70" cy="60" r="10" fill="#dd5d1b" stroke="#ffffff" stroke-width="2" />
        
        <!-- Highlighted Top Orange Question Mark -->
        <text class="question-mark-main" x="70" y="24" fill="#dd5d1b" text-anchor="middle">?</text>
    </g>

    <!-- Brand Logotype (Vertically aligned) -->
    <text class="brand-text" x="140" y="78" text-anchor="start">
        <tspan fill="#4d4d4d">gimana</tspan><tspan fill="#dd5d1b">ya</tspan>
    </text>
</svg>